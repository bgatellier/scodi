$schema: ../cache/schemas/tasks.json
tasks:
  build:
    command: bun build --outdir lib --format esm --target node --packages=external --production src/index.ts
    deps:
    # build dependent projects
    - ^:build
    inputs:
    - src/**/*
    - package.json
    outputs:
    - lib
  check:
    command: biome check
    options:
      runFromWorkspaceRoot: true
  test:
    command: bun test --pass-with-no-tests
    deps:
    - target: build
  coverage:
    extends: test
    args: --coverage --coverage-reporter=lcov
