name: Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  list-projects:
    name: List projects
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.moon-query.outputs.projects }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: true

      # Guess projects that have been changed:
      # - for Pull Requests (github.ref starts with 'refs/pull/'), guess from changed files only
      # - for other cases (push on a branch), guess from all files
      - name: Guess projects
        id: moon-query
        shell: bash
        env:
          ONLY_AFFECTED: ${{ startsWith(github.ref, 'refs/pull/') }}
        run: |
          if [[ "$ONLY_AFFECTED" == "true" ]]; then
            # https://moonrepo.dev/docs/commands/query/projects#affected-projects
            projects=$(moon query changed-files | moon query projects --affected --tags scodi)
          else
            # https://moonrepo.dev/docs/commands/query/projects
            projects=$(moon query projects --tags scodi)
          fi
          # keep the JSON on a single line so it fits in a single $GITHUB_OUTPUT entry
          projects=$(echo "$projects" | tr -d "[:space:]")
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  sonarcloud:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: list-projects
    # Do not run this job if no project have been changed
    # Note: GitHub performs loose equality comparisons; env.PROJECTS is an array, so GitHub GitHub coerces the type to NaN.
    # And when NaN is one of the operands of any relational comparison (>, <, >=, <=), the result is always false.
    # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#operators
    if: ${{ toJSON(fromJSON(needs.list-projects.outputs.list).projects) != '[]' }}
    strategy:
      matrix:
        projects: ${{ fromJSON(needs.list-projects.outputs.list).projects }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Disabling shallow clones is recommended for improving the relevancy of SonarQube reporting
          fetch-depth: 0

      - name: Setup Moon toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: true

      - name: Generate coverage report
        run: moon ci ${{ matrix.projects.id }}:coverage

      - uses: sonarsource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.projects.source }}
          args: >
            "-Dsonar.organization=bgatellier"
            "-Dsonar.projectKey=scodi-${{ matrix.projects.id }}"
            "-Dsonar.sources=src/"
            "-Dsonar.tests=tests/"
            "-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info"
